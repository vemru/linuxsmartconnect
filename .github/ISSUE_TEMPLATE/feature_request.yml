name: Feature Request
description: Suggest an idea or feature for smartconnect-linux
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a feature! Please check existing issues and PRs before submitting.
        Remember never to post real device IDs, tokens, or personal identifiers.

  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the problem is. Ex: I'm always frustrated when [...]
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Describe the Solution You'd Like
      description: A clear and concise description of what you want to happen.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: A clear and concise description of any alternative solutions or features you've considered.

  - type: textarea
    id: protocol_notes
    attributes:
      label: Protocol or Phone Context (if applicable)
      description: Any observed or inferred Smart Connect protocol details, APK analysis, or device constraints.
