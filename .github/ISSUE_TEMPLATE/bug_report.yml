name: Bug Report
description: Report an issue or bug in smartconnect-linux
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ### :warning: Privacy & Security Redaction Notice
        **NEVER include real personal data, secrets, or identifiers in issues!**
        Before pasting logs or descriptions, ensure you have redacted:
        - Device IDs, serial numbers, phone names
        - Wi-Fi SSIDs, passwords, and PSKs
        - Local IP addresses (use placeholders like `192.168.1.20`) and MAC addresses
        - Pairing keys, tokens, certificate fingerprints
        - Notification text, SMS messages, contacts, phone numbers
        - Personal home directory paths (e.g. `/home/username/...`)

        *For security vulnerability reports, please use GitHub Private Vulnerability Reporting under the Security tab instead of public issues.*

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Start smartconnectd with '...'
        2. Pair or connect phone
        3. Click on '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment & System Details
      description: Details about your Linux host and phone.
      value: |
        - OS / Distro: (e.g. Arch Linux, Fedora 40, Ubuntu 24.04)
        - Desktop Environment: (e.g. GNOME 46, KDE Plasma 6, Hyprland, Sway)
        - Session Type: (Wayland / X11)
        - smartconnect-linux version or commit: (e.g. v0.2.1 or git commit SHA)
        - Phone Model: (e.g. Motorola Edge 50 Neo)
        - Android Version: (e.g. Android 14)
        - Smart Connect App Version:
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs & Output
      description: Please paste terminal output or logs with sensitive information (IPs, device IDs, tokens) REDACTED.
      render: shell

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-Submission Checklist
      options:
        - label: I have verified that all logs and descriptions are redacted of personal data, device IDs, real IPs, and secrets.
          required: true
        - label: I have searched existing issues to ensure this is not a duplicate.
          required: true
