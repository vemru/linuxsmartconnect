name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  check-and-test:
    name: Check, Lint & Test
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Install system dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            git \
            base-devel \
            rust \
            pkgconf \
            dbus \
            glib2 \
            gtk4 \
            libadwaita \
            gstreamer \
            gst-plugins-base \
            gst-plugins-base-libs \
            gst-plugins-good \
            gst-plugins-bad \
            gst-plugins-bad-libs \
            gst-libav \
            libnice \
            wayland \
            fuse3 \
            cargo-deny

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Cargo Cache
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check code formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace

      - name: Check dependencies and licenses (cargo-deny)
        run: cargo-deny check advisories licenses

  secret-scan:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  install-smoke-test:
    name: Install Smoke Test (${{ matrix.distro }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: archlinux
            image: archlinux:latest
            setup: pacman -Syu --noconfirm --needed git base-devel rust pkgconf dbus glib2 gtk4 libadwaita gstreamer gst-plugins-base fuse3 util-linux
          - distro: fedora-40
            image: fedora:40
            setup: dnf -y install git gcc pkgconf-pkg-config rust cargo glib2-devel gtk4-devel libadwaita-devel gstreamer1-devel fuse3-devel dbus-devel util-linux shadow-utils
          - distro: ubuntu-24.04
            image: ubuntu:24.04
            setup: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y git build-essential pkg-config libdbus-1-dev libglib2.0-dev libgtk-4-dev libadwaita-1-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev fuse3 cargo
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install dependencies
        run: ${{ matrix.setup }}
      - name: Setup unprivileged user and run smoke tests
        run: |
          useradd -m -s /bin/bash testuser || adduser -D testuser
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          chown -R testuser:testuser "$GITHUB_WORKSPACE"
          su testuser -c "cd '$GITHUB_WORKSPACE' && ./packaging/install.sh --dry-run"
          su testuser -c "cd '$GITHUB_WORKSPACE' && ./packaging/install.sh --uninstall --dry-run"
          su testuser -c "cd '$GITHUB_WORKSPACE' && ./packaging/install.sh --uninstall --purge --dry-run"
