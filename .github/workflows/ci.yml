name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  check-and-test:
    name: Check, Lint & Test
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Install system dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            git \
            base-devel \
            rust \
            pkgconf \
            dbus \
            glib2 \
            gtk4 \
            libadwaita \
            gstreamer \
            gst-plugins-base \
            gst-plugins-base-libs \
            gst-plugins-good \
            gst-plugins-bad \
            gst-plugins-bad-libs \
            gst-libav \
            libnice \
            wayland \
            fuse3

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cargo Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check code formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace

  install-smoke-test:
    name: Install Smoke Test (${{ matrix.distro }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: archlinux
            image: archlinux:latest
            setup: pacman -Syu --noconfirm --needed git base-devel rust pkgconf dbus glib2 gtk4 libadwaita gstreamer gst-plugins-base fuse3
          - distro: fedora-40
            image: fedora:40
            setup: dnf -y install git gcc pkgconf-pkg-config rust cargo glib2-devel gtk4-devel libadwaita-devel gstreamer1-devel fuse3-devel dbus-devel
          - distro: ubuntu-24.04
            image: ubuntu:24.04
            setup: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y git build-essential pkg-config libdbus-1-dev libglib2.0-dev libgtk-4-dev libadwaita-1-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev fuse3 cargo
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install dependencies
        run: ${{ matrix.setup }}
      - name: Run installer smoke test
        run: ./packaging/install.sh --dry-run

