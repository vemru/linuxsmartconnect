<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <title>Smart Connect for Linux</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#62a0ea"/>
      <stop offset="1" stop-color="#1a5fb4"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)"/>
  <!-- PC monitor -->
  <rect x="14" y="30" width="68" height="48" rx="6" fill="#ffffff"/>
  <rect x="20" y="36" width="56" height="36" rx="2" fill="#1c71d8"/>
  <rect x="42" y="78" width="12" height="10" fill="#ffffff"/>
  <rect x="32" y="88" width="32" height="6" rx="3" fill="#ffffff"/>
  <!-- link between the two -->
  <circle cx="86" cy="60" r="2.5" fill="#ffffff"/>
  <circle cx="92" cy="60" r="2.5" fill="#ffffff"/>
  <!-- phone -->
  <rect x="96" y="38" width="22" height="44" rx="5" fill="#ffffff"/>
  <rect x="99" y="43" width="16" height="31" rx="1.5" fill="#1c71d8"/>
  <circle cx="107" cy="78" r="1.8" fill="#1c71d8"/>
</svg>
