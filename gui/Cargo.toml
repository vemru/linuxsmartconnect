[package]
name = "smartconnect-gui"
version = "0.2.0"
edition = "2021"
description = "GTK4/libadwaita front-end for smartconnectd"
repository = "https://github.com/vemru/linuxsmartconnect"
homepage = "https://github.com/vemru/linuxsmartconnect"
license = "MIT"

[[bin]]
name = "smartconnect-gui"
path = "src/main.rs"

[dependencies]
gtk = { package = "gtk4", version = "0.10", features = ["v4_18"] }
adw = { package = "libadwaita", version = "0.8", features = ["v1_7"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-channel = "2"
libc = "0.2"
ksni = { version = "0.3.7", features = ["blocking"] }
